<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)" stroke="#60a5fa" stroke-width="2"/>
  
  <!-- Airplane -->
  <g transform="translate(16, 20)">
    <!-- Main body -->
    <ellipse cx="16" cy="12" rx="8" ry="3" fill="#ffffff"/>
    <!-- Wings -->
    <ellipse cx="8" cy="12" rx="4" ry="2" fill="#ffffff"/>
    <ellipse cx="24" cy="12" rx="4" ry="2" fill="#ffffff"/>
    <!-- Tail -->
    <path d="M16 9 L20 5 L18 7 L16 9 Z" fill="#ffffff"/>
    <!-- Propeller -->
    <circle cx="16" cy="12" r="1" fill="#1e40af"/>
  </g>
  
  <!-- Map pin for destination -->
  <g transform="translate(44, 20)">
    <circle cx="0" cy="0" r="4" fill="#fbbf24"/>
    <path d="M0 4 L-3 8 L3 8 Z" fill="#fbbf24"/>
    <circle cx="0" cy="0" r="1.5" fill="#ffffff"/>
  </g>
  
  <!-- Calendar/Itinerary element -->
  <g transform="translate(20, 44)">
    <rect x="0" y="0" width="8" height="6" rx="1" fill="#ffffff"/>
    <rect x="1" y="1" width="6" height="1" fill="#1e40af"/>
    <circle cx="2" cy="3" r="0.5" fill="#1e40af"/>
    <circle cx="4" cy="3" r="0.5" fill="#1e40af"/>
    <circle cx="6" cy="3" r="0.5" fill="#1e40af"/>
  </g>
</svg>
